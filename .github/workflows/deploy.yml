name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Require Supabase build variables
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY must be configured as repository variables."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Notify Discord
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        # Titles are passed via env and encoded with jq so they can never inject shell code.
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::DISCORD_DEPLOY_WEBHOOK is not set, skipping Discord notification."
            exit 0
          fi
          # Prefer the German PR title; fall back to the commit title.
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)][0] // {} | {number, title, html_url}' 2>/dev/null) || pr='{}'
          jq -e 'type == "object"' <<<"$pr" >/dev/null 2>&1 || pr='{}'
          title=$(jq -r '.title // empty' <<<"$pr")
          [ -n "$title" ] || title=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)
          [ -n "$title" ] || title='Manuell gestartet'
          payload=$(jq -n \
            --arg title "${title:0:200}" \
            --argjson pr "$pr" \
            --arg short "${SHA:0:7}" \
            --arg commit "$COMMIT_URL" \
            --arg page "$PAGE_URL" \
            '{
              content: ("🚀 **Neue Version live**\n\($title)\n"
                + (if $pr.number then "[PR #\($pr.number)](\($pr.html_url)) · " else "" end)
                + "[`\($short)`](\($commit)) · \($page)"),
              allowed_mentions: {parse: []},
              flags: 4
            }')
          if ! curl -sS --fail --max-time 10 -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK" -o /dev/null; then
            echo "::warning::Discord notification failed, the deployment itself succeeded."
          fi
